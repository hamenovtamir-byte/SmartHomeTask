<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты теста</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container result-container">
        <h2>Тест успешно завершен! 🎉</h2>
        <div class="result-card">
            <p>Ваш результат: <strong>{{ score }}%</strong></p>
            <p>Правильных ответов: <strong>{{ correct }} из {{ total }}</strong></p>
        </div>
        <a href="/student" class="btn-submit" style="display: block; text-align: center; text-decoration: none; margin-top: 20px;">Вернуться к списку тестов</a>
    </div>
</body>
</html>
