<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart HomeTask — Главная</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: background 0.2s;
        }
        .btn-teacher {
            background-color: #3498db;
        }
        .btn-teacher:hover {
            background-color: #2980b9;
        }
        .btn-student {
            background-color: #2ecc71;
        }
        .btn-student:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart HomeTask</h1>
        <p>Платформа домашних заданий<br><b>Powered by Tarim AI</b></p>
        
        <a href="/login?role=teacher" class="btn btn-teacher">Войти как Учитель</a>
        <a href="/login?role=student" class="btn btn-student">Войти как Ученик</a>
    </div>
</body>
</html>
