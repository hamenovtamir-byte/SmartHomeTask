<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решение теста: {{ task.topic }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="test-header">
            <h2>Тема: {{ task.topic }}</h2>
            <div class="timer">Осталось времени: <span id="timer-display">{{ task.time_limit }}:00</span></div>
        </header>

        <form action="/submit_task" method="POST" id="test-form">
            <input type="hidden" name="task_id" value="{{ task.id }}">
            <input type="hidden" name="tab_switches" id="tab_switches" value="0">

            {% for q in questions %}
                <div class="question-card">
                    <h3>Вопрос {{ loop.index }}: {{ q.question }}</h3>
                    <div class="options-list">
                        {% for option in q.options %}
                            <label class="option-label">
                                <!-- Используем ID вопроса в имени, чтобы группы никогда не пересекались -->
                                <input type="radio" name="q_{{ q.id }}" value="{{ option }}" required>
                                <span>{{ option }}</span>
                            </label>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}

            <button type="submit" class="btn-submit">Завершить и сдать тест</button>
        </form>
    </div>

    <script>
        // Защита от списывания (переключение вкладок)
        let tabSwitches = 0;
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                tabSwitches++;
                document.getElementById("tab_switches").value = tabSwitches;
            }
        });

        // Таймер обратного отсчета
        let timeLeft = {{ task.time_limit }} * 60;
        const timerDisplay = document.getElementById("timer-display");
        
        const timer = setInterval(function() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                alert("Время вышло! Тест будет отправлен автоматически.");
                document.getElementById("test-form").submit();
            }
            timeLeft--;
        }, 1000);
    </script>
</body>
</html>
