<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - Smart HomeTask</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: height: 100vh; height: 100vh; }
        .login-card { max-width: 400px; width: 100%; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">Вход в систему</h3>

    <!-- Блок вывода ошибки, если она есть -->
    {% if error %}
        <div class="alert alert-danger py-2" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="mb-3">
            <label for="username" class="form-label">Логин</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Войти</button>
        </div>
    </form>
</div>

</body>
</html>
